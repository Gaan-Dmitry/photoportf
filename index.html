<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профессиональная фоторетушь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный экран -->
    <header class="hero">
        <div class="container">
            <h1 class="hero-title">Взглянем на ваши снимки <span>иначе</span></h1>
            <p class="hero-subtitle">Бесплатная профессиональная ретушь до 01.11.2026. Загрузите свой исходник, и я покажу, на что он способен.</p>
            <a href="#upload-form" class="btn-primary">Загрузить фото</a>
        </div>
    </header>

    <!-- Секция портфолио (с заготовками под слайдер) -->
    <section class="portfolio">
        <div class="container">
            <h2 class="section-title">Примеры работ</h2>
            
            <div class="portfolio-grid">
                <!-- Карточка 1 (пока картинка грузится, работает skeleton) -->
                <div class="portfolio-card skeleton">
                    <!-- Сюда позже вставим JS-слайдер -->
                    <img src="your-image-1.webp" alt="Пример ретуши" loading="lazy" onload="this.parentElement.classList.remove('skeleton')">
                </div>
                
                <!-- Карточка 2 -->
                <div class="portfolio-card skeleton">
                    <img src="your-image-2.webp" alt="Пример ретуши" loading="lazy" onload="this.parentElement.classList.remove('skeleton')">
                </div>

                <!-- Карточка 3 -->
                <div class="portfolio-card skeleton">
                    <img src="your-image-3.webp" alt="Пример ретуши" loading="lazy" onload="this.parentElement.classList.remove('skeleton')">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
